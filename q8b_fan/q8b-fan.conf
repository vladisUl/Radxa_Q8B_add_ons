# Q8B fan controller v2. All tunable engineering settings; reload: systemctl reload q8b-fan
# WARNING: The numbers below are initial guesses. Thermal limits are supervisor thresholds,
# NOT Qualcomm-specified hardware throttle temperatures.
setpoint_c = 50
# Cooling activation: smoothed maximum CPU/GPU/NPU reaches setpoint.
off_hysteresis_c = 3
off_confirm_s = 20
sample_s = 1
# Applies only with --record; normal mode writes events only.
log_period_s = 5
envelope_s = 10
filter_tau_s = 8

# PI for negative plant gain dT/dPWM<0; error = Tfeedback - Tset.
kp = 12.0
ki = 0.10

# PWM 0 is commanded in OFF; ADSP may still pulse the motor every ~4 seconds.
# Replace start/hold with experimentally measured values after calibration.
pwm_start = 160
pwm_hold = 100
pwm_max = 255
kick_s = 1.2
pwm_up_per_s = 30
pwm_down_per_s = 8

# Independent raw-sensor protection. No filtering or averaging here.
cpu_limit_c = 75
gpu_limit_c = 75
npu_limit_c = 75
memory_limit_c = 80
pmic_limit_c = 85
vbat_limit_c = 65
protection_hysteresis_c = 5
protection_recovery_s = 60
